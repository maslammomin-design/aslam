name: SAYAEDUCATION Android Debug APK
on:
  push:
    branches: [main]
    paths:
      - 'SAYAEDUCATION-Android/**'
      - '.github/workflows/sayaeducation-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SAYAEDUCATION-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "Android SDK location: ${ANDROID_HOME}"
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          yes | "${SDK_MANAGER}" --licenses >/dev/null || true
          "${SDK_MANAGER}" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sayaeducation-debug-apk
          path: SAYAEDUCATION-Android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
